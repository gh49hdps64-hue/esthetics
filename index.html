<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esthetic Dentistry — Practice Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0c0e14;
    --surface: #13151f;
    --surface2: #1a1d2b;
    --surface3: #20243a;
    --border: #272b40;
    --border2: #333858;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --accent3: #fb923c;
    --correct: #34d399;
    --wrong: #f87171;
    --text: #e2e8f8;
    --muted: #6b7494;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --display: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    min-height: 100vh;
  }

  .progress-wrap {
    height: 2px;
    background: var(--border);
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 300;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
    transition: width 0.4s ease;
    width: 0%;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 200;
    backdrop-filter: blur(8px);
    flex-wrap: wrap;
    gap: 10px;
  }
  .header-left h1 {
    font-family: var(--display);
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .header-left .subtitle {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.05em;
  }
  .score-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .score-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .score-pill span { color: var(--accent); font-weight: 500; }
  .reset-btn-header {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted);
    border-radius: 20px;
    padding: 5px 14px;
    font-family: var(--mono);
    font-size: 0.72rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .reset-btn-header:hover { border-color: var(--accent3); color: var(--accent3); }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 100px;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 56px 0 22px;
  }
  .section-label:first-of-type { margin-top: 0; }
  .section-num {
    font-family: var(--display);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--bg);
    background: var(--accent2);
    padding: 3px 10px;
    border-radius: 4px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .section-title {
    font-family: var(--display);
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 26px;
    margin-bottom: 12px;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .q-card:hover { border-color: var(--border2); }
  .q-card.answered-correct {
    border-color: rgba(52,211,153,0.45);
    box-shadow: 0 0 0 1px rgba(52,211,153,0.12) inset;
  }
  .q-card.answered-wrong {
    border-color: rgba(248,113,113,0.45);
    box-shadow: 0 0 0 1px rgba(248,113,113,0.1) inset;
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .q-num {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
    background: var(--surface3);
    border: 1px solid var(--border);
    padding: 2px 9px;
    border-radius: 5px;
  }

  .q-text {
    font-size: 0.93rem;
    line-height: 1.65;
    color: var(--text);
    font-weight: 400;
    margin-bottom: 16px;
  }

  .options { display: flex; flex-direction: column; gap: 7px; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    width: 100%;
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.87rem;
    font-weight: 300;
    line-height: 1.55;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(110,231,183,0.06);
  }
  .opt:disabled { cursor: default; }

  .opt-letter {
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--muted);
    background: var(--surface3);
    width: 22px;
    height: 22px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.15s;
  }

  .opt.correct-ans { border-color: var(--correct) !important; background: rgba(52,211,153,0.1) !important; }
  .opt.correct-ans .opt-letter { background: var(--correct); color: #0c0e14; }
  .opt.wrong-ans { border-color: var(--wrong) !important; background: rgba(248,113,113,0.09) !important; }
  .opt.wrong-ans .opt-letter { background: var(--wrong); color: #0c0e14; }
  .opt.reveal-correct { border-color: rgba(52,211,153,0.35) !important; background: rgba(52,211,153,0.05) !important; }
  .opt.reveal-correct .opt-letter { color: var(--correct); background: rgba(52,211,153,0.15); }

  .feedback {
    margin-top: 12px;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 0.84rem;
    line-height: 1.6;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: rgba(52,211,153,0.09); border: 1px solid rgba(52,211,153,0.28); color: #86efcb; }
  .feedback.wrong-fb { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.24); color: #fca5a5; }
  .feedback strong { font-weight: 500; }
  .icon-correct::before { content: '✓ '; }
  .icon-wrong::before { content: '✗ '; }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    .container { padding: 32px 14px 80px; }
    .q-card { padding: 16px 16px; }
    .header-left h1 { font-size: 0.9rem; }
  }
</style>
</head>

function buildExam() {
  const container = document.getElementById('examContainer');

    secTitle.className = 'section-title';
    secTitle.textContent = section.label;

    const secLine = document.createElement('div');
    secLine.className = 'section-line';

    secDiv.appendChild(secTitle);
    secDiv.appendChild(secLine);
    container.appendChild(secDiv);

    section.questions.forEach((q) => {
      totalQ++;
      const card = document.createElement('div');
      card.className = 'q-card';
      card.id = 'card-' + q.id;

      const meta = document.createElement('div');
      meta.className = 'q-meta';

      const num = document.createElement('span');
      num.className = 'q-num';
      num.textContent = 'Q' + totalQ;
      meta.appendChild(num);
      card.appendChild(meta);

      const qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = q.text;
      card.appendChild(qText);

      const optWrap = document.createElement('div');
      optWrap.className = 'options';
      const letters = ['A','B','C','D','E','F'];

      q.options.forEach((opt, oi) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.id = 'opt-' + q.id + '-' + oi;
        btn.innerHTML = `<span class="opt-letter">${letters[oi]}</span><span>${opt}</span>`;
        btn.addEventListener('click', () => answerQuestion(q, oi));
        optWrap.appendChild(btn);
      });

      card.appendChild(optWrap);

      const feedback = document.createElement('div');
      feedback.className = 'feedback';
      feedback.id = 'fb-' + q.id;
      card.appendChild(feedback);

      container.appendChild(card);
    });
  });

  document.getElementById('totalCount').textContent = totalQ;
  scores.total = totalQ;
  updateProgress();
}

function answerQuestion(q, chosen) {
  if (answered[q.id]) return;
  answered[q.id] = true;
  const isCorrect = chosen === q.correct;
  if (isCorrect) scores.correct++;

  const card = document.getElementById('card-' + q.id);
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  q.options.forEach((_, oi) => {
    const btn = document.getElementById('opt-' + q.id + '-' + oi);
    btn.disabled = true;
    if (oi === q.correct) {
      btn.classList.add(oi === chosen ? 'correct-ans' : 'reveal-correct');
    } else if (oi === chosen && !isCorrect) {
      btn.classList.add('wrong-ans');
    }
  });

  showFeedback(q, isCorrect, chosen);
  updateStats();
}

function showFeedback(q, isCorrect, chosen) {
  const fb = document.getElementById('fb-' + q.id);
  const correctLetter = ['A','B','C','D','E','F'][q.correct];
  const correctText = q.options[q.correct];
  if (isCorrect) {
    fb.className = 'feedback correct-fb show';
    fb.innerHTML = `<strong class="icon-correct">Correct!</strong> <strong>${correctLetter}. ${correctText}</strong>`;
  } else {
    fb.className = 'feedback wrong-fb show';
    fb.innerHTML = `<strong class="icon-wrong">Incorrect.</strong> The answer is <strong>${correctLetter}. ${correctText}</strong>`;
  }
}

function updateStats() {
  document.getElementById('answeredCount').textContent = Object.keys(answered).length;
  document.getElementById('scoreCount').textContent = scores.correct;
  updateProgress();
}

function updateProgress() {
  const pct = scores.total ? (Object.keys(answered).length / scores.total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function resetAll() {
  answered = {};
  scores.correct = 0;
  updateStats();
  buildExam();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildExam();
</script>
</body>
</html>
